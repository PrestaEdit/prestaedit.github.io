name: Deploy POC to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'poc-astro/**'
      - '.github/workflows/deploy-poc.yml'
  pull_request:
    paths:
      - 'poc-astro/**'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-astro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: poc-astro/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=prestaedit-poc
          workingDirectory: poc-astro
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
