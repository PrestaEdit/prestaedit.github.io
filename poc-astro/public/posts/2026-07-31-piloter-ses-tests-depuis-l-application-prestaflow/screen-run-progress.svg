<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="750" fill="#f1f5f9"/>
  <rect x="40" y="40" width="1120" height="670" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="40" y="40" width="1120" height="44" rx="12" fill="#f8fafc"/>
  <rect x="40" y="72" width="1120" height="12" fill="#f8fafc"/>
  <circle cx="72" cy="62" r="6" fill="#ef4444"/>
  <circle cx="92" cy="62" r="6" fill="#f59e0b"/>
  <circle cx="112" cy="62" r="6" fill="#10b981"/>
  <text x="600" y="66" text-anchor="middle" fill="#64748b" font-size="13">psflowdemo · Checkout · running</text>
  <rect x="1030" y="52" width="118" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1089" y="68" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600" letter-spacing="0.5">APERÇU · MOCKUP</text>

  <!-- sidebar -->
  <rect x="40" y="84" width="260" height="626" fill="#f8fafc"/>
  <line x1="300" y1="84" x2="300" y2="710" stroke="#e2e8f0"/>
  <text x="64" y="120" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1">SUITES</text>
  <rect x="52" y="132" width="236" height="40" rx="6" fill="#ecfdf5"/>
  <rect x="52" y="132" width="3" height="40" fill="#059669"/>
  <text x="68" y="150" fill="#0f172a" font-size="13" font-weight="600">Checkout</text>
  <text x="68" y="164" fill="#059669" font-size="11">⟳ running…</text>
  <text x="68" y="200" fill="#334155" font-size="13">DisplayHome</text>
  <text x="68" y="240" fill="#334155" font-size="13">UpdateTitle</text>

  <!-- header -->
  <text x="330" y="130" fill="#0f172a" font-size="22" font-weight="700">Checkout</text>
  <text x="330" y="152" fill="#64748b" font-size="13">3/6 étapes · 4.2s écoulées</text>

  <!-- progress bar -->
  <rect x="330" y="170" width="800" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="330" y="170" width="400" height="8" rx="4" fill="#059669"/>

  <!-- steps -->
  <g font-size="13">
    <circle cx="348" cy="222" r="10" fill="#10b981"/>
    <text x="343" y="227" fill="#ffffff" font-size="12" font-weight="700">✓</text>
    <text x="370" y="227" fill="#0f172a">it("charge la home", …)</text>
    <text x="1110" y="227" fill="#94a3b8" text-anchor="end">820ms</text>

    <circle cx="348" cy="262" r="10" fill="#10b981"/>
    <text x="343" y="267" fill="#ffffff" font-size="12" font-weight="700">✓</text>
    <text x="370" y="267" fill="#0f172a">it("ajoute un produit au panier", …)</text>
    <text x="1110" y="267" fill="#94a3b8" text-anchor="end">1240ms</text>

    <circle cx="348" cy="302" r="10" fill="#10b981"/>
    <text x="343" y="307" fill="#ffffff" font-size="12" font-weight="700">✓</text>
    <text x="370" y="307" fill="#0f172a">it("va au checkout", …)</text>
    <text x="1110" y="307" fill="#94a3b8" text-anchor="end">2140ms</text>

    <circle cx="348" cy="342" r="10" fill="#059669"/>
    <text x="370" y="347" fill="#0f172a" font-weight="600">it("saisit l'adresse", …)</text>
    <text x="1110" y="347" fill="#059669" text-anchor="end" font-weight="600">en cours…</text>

    <circle cx="348" cy="382" r="10" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <text x="370" y="387" fill="#94a3b8">it("valide le paiement", …)</text>

    <circle cx="348" cy="422" r="10" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <text x="370" y="427" fill="#94a3b8">it("confirme la commande", …)</text>
  </g>

  <!-- live screenshot area -->
  <rect x="330" y="470" width="800" height="210" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="6 4"/>
  <text x="730" y="570" text-anchor="middle" fill="#94a3b8" font-size="13">Capture live de l'étape en cours</text>
  <text x="730" y="590" text-anchor="middle" fill="#cbd5e1" font-size="11">(rendue au fil du run)</text>
</svg>
