<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1200" height="750" fill="#f1f5f9"/>
  <text x="600" y="90" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="700">Bouton « Sync now » — avant / après</text>
  <text x="600" y="118" text-anchor="middle" fill="#64748b" font-size="13">Vue résultat, coin haut-droit</text>
  <rect x="1030" y="82" width="118" height="24" rx="12" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1089" y="98" text-anchor="middle" fill="#92400e" font-size="11" font-weight="600" letter-spacing="0.5">APERÇU · MOCKUP</text>

  <!-- BEFORE -->
  <text x="300" y="180" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">AVANT SYNC</text>
  <rect x="80" y="200" width="440" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="104" y="234" fill="#0f172a" font-size="16" font-weight="700">Run #142 · Checkout</text>
  <text x="104" y="254" fill="#64748b" font-size="12">4 passed · 1 failed · 8.4s</text>
  <text x="104" y="288" fill="#94a3b8" font-size="12">Ce run n'a pas encore été poussé vers</text>
  <text x="104" y="304" fill="#94a3b8" font-size="12">prestaflow.io.</text>

  <rect x="104" y="326" width="160" height="38" rx="8" fill="#059669"/>
  <text x="184" y="350" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">⇧  Sync now</text>

  <!-- arrow -->
  <path d="M540 290 L660 290" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <path d="M650 284 L660 290 L650 296" stroke="#94a3b8" stroke-width="2" fill="none"/>

  <!-- AFTER -->
  <text x="900" y="180" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">APRÈS SYNC (SUCCÈS)</text>
  <rect x="680" y="200" width="440" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="704" y="234" fill="#0f172a" font-size="16" font-weight="700">Run #142 · Checkout</text>
  <text x="704" y="254" fill="#64748b" font-size="12">4 passed · 1 failed · 8.4s</text>
  <text x="704" y="288" fill="#059669" font-size="12">✓ Synced il y a quelques secondes</text>
  <text x="704" y="304" fill="#64748b" font-size="12">Visible sur prestaflow.io/projects/psflowdemo</text>

  <rect x="704" y="326" width="280" height="38" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="844" y="350" text-anchor="middle" fill="#059669" font-size="13" font-weight="600">✓ Synced — Open on prestaflow.io</text>

  <!-- FAILURE state -->
  <text x="600" y="450" text-anchor="middle" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">EN CAS D'ÉCHEC</text>
  <rect x="380" y="470" width="440" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="404" y="504" fill="#0f172a" font-size="16" font-weight="700">Run #142 · Checkout</text>
  <text x="404" y="524" fill="#64748b" font-size="12">4 passed · 1 failed · 8.4s</text>
  <text x="404" y="558" fill="#ef4444" font-size="12">✗ Sync failed — 401 Unauthorized</text>
  <text x="404" y="574" fill="#94a3b8" font-size="12">Product Key invalide ou expirée</text>

  <rect x="404" y="596" width="200" height="38" rx="8" fill="#fef2f2" stroke="#ef4444"/>
  <text x="504" y="620" text-anchor="middle" fill="#ef4444" font-size="13" font-weight="600">✗ Failed — Retry</text>
</svg>
