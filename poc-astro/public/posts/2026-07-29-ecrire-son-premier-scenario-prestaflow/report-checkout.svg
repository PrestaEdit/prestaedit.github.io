<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="Sortie CLI PrestaFlow après le scénario GuestCheckout">
  <style>
    .win  { fill: #1e1e2e; }
    .bar  { fill: #313244; }
    .ttl  { fill: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 500; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
    .txt  { fill: #cdd6f4; }
    .muted{ fill: #7f849c; }
    .ok   { fill: #a6e3a1; }
    .warn { fill: #f9e2af; }
    .accent{ fill: #89b4fa; font-weight: 600; }
    .stat { fill: #a6e3a1; font-weight: 600; }
  </style>

  <!-- Window frame -->
  <rect class="win" x="0" y="0" width="900" height="480" rx="8"/>
  <rect class="bar" x="0" y="0" width="900" height="32" rx="8"/>
  <rect class="bar" x="0" y="20" width="900" height="12"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="16" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="16" r="6" fill="#a6e3a1"/>
  <text x="450" y="20" text-anchor="middle" class="ttl">Terminal — prestaflow run tests/prestaflow</text>

  <!-- CLI content -->
  <g class="mono">
    <text x="24" y="70"  class="muted">$ ./vendor/bin/prestaflow run tests/prestaflow</text>

    <text x="24" y="110" class="accent">▸ Checkout — Parcours d'achat invité</text>

    <text x="40" y="140" class="ok">  ✓</text>
    <text x="72" y="140" class="txt">add a product to the cart</text>
    <text x="876" y="140" text-anchor="end" class="muted">2.34s</text>

    <text x="40" y="164" class="ok">  ✓</text>
    <text x="72" y="164" class="txt">checkout as a guest and enter an address</text>
    <text x="876" y="164" text-anchor="end" class="muted">4.12s</text>

    <text x="40" y="188" class="ok">  ✓</text>
    <text x="72" y="188" class="txt">choose shipping and place the order</text>
    <text x="876" y="188" text-anchor="end" class="muted">3.87s</text>

    <text x="40" y="212" class="ok">  ✓</text>
    <text x="72" y="212" class="txt">reach the order confirmation</text>
    <text x="876" y="212" text-anchor="end" class="muted">1.52s</text>

    <text x="24" y="260" class="muted">─────────────────────────────────────────────────────────────────────────</text>

    <text x="24" y="290" class="txt">Suites   :</text>
    <text x="140" y="290" class="stat">1 passed</text>

    <text x="24" y="314" class="txt">Tests    :</text>
    <text x="140" y="314" class="stat">4 passed</text>
    <text x="220" y="314" class="muted">(0 failed, 0 skipped)</text>

    <text x="24" y="338" class="txt">Duration :</text>
    <text x="140" y="338" class="warn">11.85s</text>

    <text x="24" y="400" class="muted">Rapport JSON écrit dans tests/prestaflow/reports/results.json</text>
    <text x="24" y="424" class="ok">✓ All tests passed</text>
  </g>
</svg>
