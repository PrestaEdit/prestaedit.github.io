<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-label="Sortie CLI PrestaFlow avec les trois suites exécutées">
  <style>
    .win  { fill: #1e1e2e; }
    .bar  { fill: #313244; }
    .ttl  { fill: #cdd6f4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 12px; font-weight: 500; }
    .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14px; }
    .txt  { fill: #cdd6f4; }
    .muted{ fill: #7f849c; }
    .ok   { fill: #a6e3a1; }
    .warn { fill: #f9e2af; }
    .accent{ fill: #89b4fa; font-weight: 600; }
    .stat { fill: #a6e3a1; font-weight: 600; }
  </style>

  <!-- Window frame -->
  <rect class="win" x="0" y="0" width="900" height="620" rx="8"/>
  <rect class="bar" x="0" y="0" width="900" height="32" rx="8"/>
  <rect class="bar" x="0" y="20" width="900" height="12"/>
  <circle cx="20" cy="16" r="6" fill="#f38ba8"/>
  <circle cx="40" cy="16" r="6" fill="#f9e2af"/>
  <circle cx="60" cy="16" r="6" fill="#a6e3a1"/>
  <text x="450" y="20" text-anchor="middle" class="ttl">Terminal — prestaflow run tests/prestaflow</text>

  <g class="mono">
    <text x="24" y="70" class="muted">$ ./vendor/bin/prestaflow run tests/prestaflow</text>

    <!-- Suite 1 -->
    <text x="24" y="110" class="accent">▸ Checkout — Parcours d'achat invité</text>
    <text x="40" y="140" class="ok">  ✓</text>
    <text x="72" y="140" class="txt">add a product to the cart</text>
    <text x="876" y="140" text-anchor="end" class="muted">2.34s</text>
    <text x="40" y="164" class="ok">  ✓</text>
    <text x="72" y="164" class="txt">checkout as a guest and enter an address</text>
    <text x="876" y="164" text-anchor="end" class="muted">4.12s</text>
    <text x="40" y="188" class="ok">  ✓</text>
    <text x="72" y="188" class="txt">choose shipping and place the order</text>
    <text x="876" y="188" text-anchor="end" class="muted">3.87s</text>
    <text x="40" y="212" class="ok">  ✓</text>
    <text x="72" y="212" class="txt">reach the order confirmation</text>
    <text x="876" y="212" text-anchor="end" class="muted">1.52s</text>

    <!-- Suite 2 -->
    <text x="24" y="252" class="accent">▸ DisplayHome — Bloc psflowdemo sur la home</text>
    <text x="40" y="282" class="ok">  ✓</text>
    <text x="72" y="282" class="txt">affiche le bloc</text>
    <text x="876" y="282" text-anchor="end" class="muted">0.98s</text>
    <text x="40" y="306" class="ok">  ✓</text>
    <text x="72" y="306" class="txt">affiche le titre par défaut</text>
    <text x="876" y="306" text-anchor="end" class="muted">0.42s</text>

    <!-- Suite 3 -->
    <text x="24" y="346" class="accent">▸ UpdateTitle — Modification du titre depuis le BO</text>
    <text x="40" y="376" class="ok">  ✓</text>
    <text x="72" y="376" class="txt">se connecte au BO</text>
    <text x="876" y="376" text-anchor="end" class="muted">1.24s</text>
    <text x="40" y="400" class="ok">  ✓</text>
    <text x="72" y="400" class="txt">met à jour le titre du bloc</text>
    <text x="876" y="400" text-anchor="end" class="muted">0.89s</text>
    <text x="40" y="424" class="ok">  ✓</text>
    <text x="72" y="424" class="txt">affiche le nouveau titre sur la home</text>
    <text x="876" y="424" text-anchor="end" class="muted">0.51s</text>

    <text x="24" y="464" class="muted">─────────────────────────────────────────────────────────────────────────</text>

    <text x="24" y="494" class="txt">Suites   :</text>
    <text x="140" y="494" class="stat">3 passed</text>

    <text x="24" y="518" class="txt">Tests    :</text>
    <text x="140" y="518" class="stat">9 passed</text>
    <text x="220" y="518" class="muted">(0 failed, 0 skipped)</text>

    <text x="24" y="542" class="txt">Duration :</text>
    <text x="140" y="542" class="warn">15.89s</text>

    <text x="24" y="590" class="ok">✓ All tests passed</text>
  </g>
</svg>
